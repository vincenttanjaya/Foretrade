<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Foretrade Admin</title>
    <meta name="description" content="Operator console for Foretrade. Administrators only." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0D12" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='3' y='3' width='58' height='58' rx='13' fill='%230F1B2D' stroke='%23C8962E' stroke-width='4'/%3E%3Cpath fill='%23E0B252' d='M19 31h2v4h3v10h-3v4h-2v-4h-3V35h3zM31 23h2v4h3v10h-3v4h-2v-4h-3V27h3zM43 15h2v4h3v10h-3v4h-2v-4h-3V19h3z'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..600&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap"
    />
    <script>
      // Apply the saved (or OS) theme before first paint so there is no flash.
      var theme
      try {
        theme = localStorage.getItem('theme')
      } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
      document.documentElement.dataset.theme = theme
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Foretrade Admin needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
